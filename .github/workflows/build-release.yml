name: Build release executables

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bun_target: bun-windows-x64
            artifact_name: invo-sentinel-windows-x64
            executable: invo-sentinel.exe
            wrapper_src: scripts/start.bat
            wrapper_dest: start.bat
            docs_src: scripts/release-docs/GETTING-STARTED-windows.txt
          - os: ubuntu-latest
            bun_target: bun-linux-x64
            artifact_name: invo-sentinel-linux-x64
            executable: invo-sentinel
            wrapper_src: scripts/start.sh
            wrapper_dest: start.sh
            docs_src: scripts/release-docs/GETTING-STARTED-linux.txt
          - os: macos-latest
            bun_target: bun-darwin-arm64
            artifact_name: invo-sentinel-macos-arm64
            executable: invo-sentinel
            wrapper_src: scripts/start.sh
            wrapper_dest: start.sh
            docs_src: scripts/release-docs/GETTING-STARTED-macos.txt
          - os: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
            artifact_name: invo-sentinel-linux-arm64
            executable: invo-sentinel
            wrapper_src: scripts/start.sh
            wrapper_dest: start.sh
            docs_src: scripts/release-docs/GETTING-STARTED-linux.txt
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ui/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Build daemon and dashboard UI (in parallel)
        shell: bash
        run: |
          (
            set -e
            bun install
            bun run scripts/smoke-test-db.ts
            bun build --compile --target=${{ matrix.bun_target }} src/cli/auto-copy.ts --outfile dist/bin/${{ matrix.executable }}
          ) &
          daemon_pid=$!

          (
            set -e
            cd ui
            npm ci
            npm run build
          ) &
          ui_pid=$!

          daemon_status=0
          ui_status=0
          wait "$daemon_pid" || daemon_status=$?
          wait "$ui_pid" || ui_status=$?

          [ "$daemon_status" -eq 0 ] || echo "::error::daemon build chain failed (exit $daemon_status)"
          [ "$ui_status" -eq 0 ] || echo "::error::UI build chain failed (exit $ui_status)"
          [ "$daemon_status" -eq 0 ] && [ "$ui_status" -eq 0 ]

      - name: Bundle restart-on-crash wrapper
        shell: bash
        run: cp "${{ matrix.wrapper_src }}" "dist/${{ matrix.wrapper_dest }}"

      - name: Assemble standalone UI bundle
        shell: bash
        run: |
          cp -r ui/public ui/.next/standalone/ui/public
          mkdir -p ui/.next/standalone/ui/.next
          cp -r ui/.next/static ui/.next/standalone/ui/.next/static
          test -f ui/.next/standalone/ui/.next/BUILD_ID || { echo "::error::standalone build is missing .next/BUILD_ID - next build did not produce a usable standalone bundle"; exit 1; }
          mkdir -p dist/bin
          cp -r ui/.next/standalone/node_modules dist/bin/node_modules
          cp -r ui/.next/standalone/ui dist/bin/ui

      - name: Bundle platform quick-start doc + .env.example + README
        shell: bash
        run: |
          cp "${{ matrix.docs_src }}" dist/GETTING-STARTED.txt
          cp .env.example README.md dist/

      - name: Mark executables runnable
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/${{ matrix.executable }} dist/${{ matrix.wrapper_dest }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip each platform's build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .) &
          done
          wait

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create/update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          allowUpdates: true
          artifacts: artifacts/*.zip,artifacts/SHA256SUMS
          generateReleaseNotes: true
